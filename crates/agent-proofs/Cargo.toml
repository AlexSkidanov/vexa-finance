[package]
name = "vexa-agent-proofs"
version = "0.1.0"
description = "Confidential transfer and spend-limit proofs for Vexa agents, with deterministic openings"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The exact version mainnet's ZK ElGamal proof program verifies against.
solana-zk-sdk = "7.0.1"
solana-zk-elgamal-proof-interface = "0.1.2"
curve25519-dalek = "4.1.3"
sha2 = "0.10"
bytemuck = "1"
wasm-bindgen = "=0.2.100"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
