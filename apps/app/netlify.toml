[build]
  base = "apps/app"
  command = "cd ../.. && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@vexa/app..."
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# The balance, transfer and agent proofs are built on the device by the zk-sdk
# WebAssembly module, hence 'wasm-unsafe-eval'. Every request goes to the Vexa
# API; the app talks to no Solana RPC or other third party.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Robots-Tag = "noindex"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://api.vexa.finance; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
