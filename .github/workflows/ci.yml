name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  vault:
    name: Vault program (fmt, clippy, build, test)
    runs-on: ubuntu-latest
    env:
      SOLANA_VERSION: v4.1.2
      ANCHOR_VERSION: 1.2.0
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/avm
            ~/.avm
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
            ~/.local/share/solana
            target
          key: vault-${{ runner.os }}-${{ env.SOLANA_VERSION }}-${{ env.ANCHOR_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: vault-${{ runner.os }}-${{ env.SOLANA_VERSION }}-${{ env.ANCHOR_VERSION }}-

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor
        run: |
          command -v avm || cargo install --git https://github.com/solana-foundation/anchor avm --locked
          avm install "$ANCHOR_VERSION" && avm use "$ANCHOR_VERSION"
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"

      - run: cargo fmt --all -- --check
      - run: cargo clippy -p vexa-vault --all-targets -- -D warnings
      - run: anchor build
      # `anchor test` runs the [scripts] test entry: LiteSVM tests against the
      # freshly built binary, with the same runtime and ZK SDK versions as mainnet.
      - run: anchor test --skip-build --skip-deploy --skip-local-validator

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
