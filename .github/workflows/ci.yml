name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  vault:
    name: Vault program and money flow (fmt, clippy, build, LiteSVM)
    runs-on: ubuntu-latest
    env:
      SOLANA_VERSION: v4.1.2
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/solana
            ~/.local/share/solana
            target
          key: vault-${{ runner.os }}-${{ env.SOLANA_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: vault-${{ runner.os }}-${{ env.SOLANA_VERSION }}-

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - run: cargo fmt --all -- --check
      - name: Build (sBPF v3)
        run: cargo build-sbf --manifest-path programs/vault/Cargo.toml --arch v3 --sbf-out-dir target/deploy
      - name: Report program size
        run: ls -l target/deploy/vault.so
      # After the build: the tests embed target/deploy/vault.so, and clippy
      # compiles them.
      - run: cargo clippy -p vexa-vault -p vexa-agent-proofs --all-targets -- -D warnings
      # LiteSVM tests against the freshly built binary, with the same runtime
      # and ZK SDK versions as mainnet. The agent proofs verify with the same
      # zk-sdk the cluster uses.
      - run: cargo test -p vexa-vault -p vexa-agent-proofs

      # The same binary, driven end to end from TypeScript: proofs built by the
      # SDK, plans checked and co-signed by the API.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@vexa/core --filter=@vexa/sdk
      - name: Money, staking and agent payments on LiteSVM
        run: |
          pnpm --filter @vexa/core exec vitest run litesvm
          pnpm --filter @vexa/api exec vitest run litesvm

  near:
    name: NEAR policy contract (fmt, clippy, test, wasm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/near-policy
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/near-policy/target
          key: near-${{ runner.os }}-${{ hashFiles('contracts/near-policy/Cargo.lock') }}
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --target wasm32-unknown-unknown --release

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
