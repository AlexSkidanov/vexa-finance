[workspace]
members = ["programs/*"]
# The NEAR policy contract builds for wasm32 with its own toolchain (cargo-near)
# and is kept out of the Solana workspace.
exclude = ["contracts/*"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AlexSkidanov/vexa-finance"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
# Program size is rent: every byte of the deployed binary is ~0.00000696 SOL
# locked for as long as the program exists. Optimize for size.
opt-level = "z"
strip = true

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
