[package]
name = "vexa-vault"
version = "0.6.0"
description = "Wraps USDC 1:1 into cUSDC, a Token-2022 mint with confidential transfers"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "vault"

[dependencies]
# Pinocchio instead of Anchor: the program's rent deposit is proportional to its
# size, and a zero-dependency program is several times smaller.
pinocchio = { version = "0.11.2", default-features = false, features = ["cpi"] }
pinocchio-system = "0.6.1"
solana-address = { version = "~2.7.0", default-features = false, features = ["copy", "decode", "syscalls", "sha2"] }
solana-sha256-hasher = { version = "3.1.0", default-features = false }

# On the host (unit tests, cargo check) PDA derivation needs the curve library
# that the on-chain syscall replaces.
[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-address = { version = "~2.7.0", features = ["curve25519"] }
solana-sha256-hasher = { version = "3.1.0", features = ["sha2"] }

[dev-dependencies]
litesvm = "0.17.0"
solana-message = "4.2.4"
solana-transaction = "4.1.5"
solana-signer = "3.0.1"
solana-keypair = "3.1.2"
solana-instruction = "3.5"
solana-pubkey = "3"
solana-clock = "3"
solana-system-interface = { version = "2", features = ["bincode"] }
bytemuck = "1"
sha2 = "0.10"
spl-token-2022-interface = "2.1.0"
spl-token-interface = "2.0.0"
spl-associated-token-account-interface = "2.0.0"
spl-token-confidential-transfer-proof-extraction = "0.5.1"
solana-instructions-sysvar = "3.0.1"
# Proofs must be generated with the same zk-sdk the cluster verifies with.
# Mainnet runs Agave 4.3, whose ZK ElGamal proof program uses solana-zk-sdk 7.
zk-sdk = { package = "solana-zk-sdk", version = "7.0.1" }
zk-proof-interface = { package = "solana-zk-elgamal-proof-interface", version = "0.1.2" }
proof-generation = { package = "spl-token-confidential-transfer-proof-generation", version = "0.6.1" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
